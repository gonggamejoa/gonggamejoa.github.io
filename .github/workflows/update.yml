# 매일 새벽 자동 업데이트(서버 없음): 수집(collect) -> 변경 있으면 data 커밋 -> 빌드 -> GitHub Pages 배포
# - 예약: 매일 04:00 KST (= 19:00 UTC 전날). 수동 실행(workflow_dispatch)도 가능.
# - main 에 push 하면(사람이 data/코드를 고친 경우) 수집 없이 빌드·배포만 한다.
# - 필요 설정(저장소 Settings): Pages > Source = "GitHub Actions" / Secrets: YOUTUBE_API_KEY(선택) /
#   Variables: SITE_URL(선택, 커스텀 도메인 주소), CUSTOM_DOMAIN(선택, 예: example.com)
name: update-and-deploy

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '전체 재수집 (키가 있으면 API, 없으면 yt-dlp 를 설치해 사용). 첫 배포 때 한 번 체크해서 실행'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write   # data/ 커밋용
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # 수집 모드
      #  - 예약 실행: RSS 증분(최신 15개, 키·yt-dlp 불필요)
      #  - 수동 실행 + '전체 재수집' 체크: 키(Secret YOUTUBE_API_KEY)가 있으면 API, 없으면 yt-dlp 를 pip 로 설치해 전체 수집
      #  키는 Secret 에서만 받는다(코드·로그에 남기지 않음). 수집이 실패하면 이 단계에서 멈춰 data 도 배포도 바뀌지 않는다.
      - name: check API key
        id: mode
        env:
          KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "has_key=true" >> "$GITHUB_OUTPUT"; else echo "has_key=false" >> "$GITHUB_OUTPUT"; fi

      - name: install yt-dlp (전체 재수집 + 키 없음)
        if: github.event_name == 'workflow_dispatch' && inputs.full && steps.mode.outputs.has_key == 'false'
        run: |
          python3 -m pip install --user -U yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          yt-dlp --version || "$HOME/.local/bin/yt-dlp" --version

      - name: collect
        if: github.event_name != 'push'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            if [ -n "$YOUTUBE_API_KEY" ]; then ARGS="--source api --refresh"; else ARGS="--source ytdlp --refresh"; fi
          else
            ARGS="--source rss"
          fi
          echo "node scripts/collect.mjs $ARGS"
          node scripts/collect.mjs $ARGS

      - name: commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "chore(data): 자동 수집 업데이트" && git push; fi

      - uses: actions/configure-pages@v5

      # 배포 경로 결정: 커스텀 도메인(CUSTOM_DOMAIN) 또는 <계정>.github.io 저장소 -> 루트(/), 그 외 -> /<저장소명> 하위경로.
      # SITE_URL 변수가 없으면 github.io 주소를 canonical 로 쓴다.
      - name: build
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -n "$CUSTOM_DOMAIN" ] || [ "${REPO_NAME,,}" = "$OWNER.github.io" ]; then BASE_PATH=""; else BASE_PATH="/$REPO_NAME"; fi
          export BASE_PATH
          export SITE_URL="${SITE_URL_VAR:-https://$OWNER.github.io}"
          echo "BASE_PATH='$BASE_PATH' SITE_URL='$SITE_URL'"
          npm run build
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > dist/CNAME; fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
